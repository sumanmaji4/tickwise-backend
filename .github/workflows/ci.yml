name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The wrapper may lose its executable bit when committed from Windows.
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      # `verify` runs the unit, web-slice and ArchUnit tests (surefire) and the Testcontainers
      # integration tests (failsafe, *IT). GitHub-hosted Ubuntu runners provide Docker.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Turn each failing test into a GitHub annotation, so the failure is visible on the run page
      # (and through the public API) without downloading logs or artifacts.
      - name: Annotate failing tests
        if: failure()
        shell: python3 {0}
        run: |
          import glob, xml.etree.ElementTree as ET
          failures = []
          for path in glob.glob("target/surefire-reports/TEST-*.xml") + glob.glob("target/failsafe-reports/TEST-*.xml"):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for kind in ("failure", "error"):
                      node = case.find(kind)
                      if node is None:
                          continue
                      detail = node.get("message") or ""
                      if not detail:
                          lines = (node.text or "").strip().splitlines()
                          detail = lines[0] if lines else ""
                      failures.append((case.get("classname", "?").split(".")[-1], case.get("name", "?"),
                                       node.get("type", kind), detail))
          for cls, name, typ, msg in failures[:10]:
              msg = " ".join(msg.split())[:600].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={cls}.{name}::{typ}: {msg}")
          print(f"::notice title=Test failures::{len(failures)} failing test(s): "
                + ", ".join(f"{c}.{n}" for c, n, _, _ in failures)[:900])

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
